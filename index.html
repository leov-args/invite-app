<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0B1219">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script>
      // Duplicated key in src/modules/opening.ts.
      try { if (sessionStorage.getItem('apertura-vista')) document.documentElement.classList.add('abierta'); } catch {}
    </script>
  </head>
  <body>
    <div class="apertura">
      <div class="apertura__halo" aria-hidden="true"></div>
      <p class="apertura__frase"></p>
      <button type="button" class="apertura__boton">
        <span></span>
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
      </button>
    </div>

    <main id="contenido" tabindex="-1" inert>
      <section class="hero">
        <div class="hero__retrato">
          <picture>
            <source type="image/webp">
            <img alt="" width="830" height="830" decoding="async">
          </picture>
        </div>
        <p class="hero__etiqueta"></p>
        <h1 class="hero__nombre">
          <span class="hero__nombre-linea"></span>
          <span class="hero__nombre-linea"></span>
        </h1>
        <img class="hero__separador" src="/assets/decoracion/separador-turquesa.png" width="460" height="40" alt="" aria-hidden="true">
        <div class="hero__scroll" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9l6 6 6-6"></path>
          </svg>
        </div>
      </section>

      <section class="vocacion" aria-labelledby="vocacion-titulo">
        <img class="vocacion__cruz" src="/assets/decoracion/cruz-medica-turquesa.png" width="48" height="48" alt="" aria-hidden="true">
        <h2 id="vocacion-titulo" class="vocacion__titulo"></h2>
        <p class="vocacion__frase"></p>

        <div class="vocacion__par">
          <figure class="vocacion__foto">
            <picture>
              <source type="image/webp">
              <img alt="" width="660" height="660" loading="lazy" decoding="async">
            </picture>
            <figcaption hidden></figcaption>
          </figure>
          <figure class="vocacion__foto">
            <picture>
              <source type="image/webp">
              <img alt="" width="840" height="840" loading="lazy" decoding="async">
            </picture>
            <figcaption hidden></figcaption>
          </figure>
        </div>

        <figure class="vocacion__foto vocacion__foto--ancha">
          <picture>
            <source type="image/webp">
            <img alt="" width="1200" height="1200" loading="lazy" decoding="async">
          </picture>
          <figcaption hidden></figcaption>
        </figure>
        <figure class="vocacion__foto vocacion__foto--ancha">
          <picture>
            <source type="image/webp">
            <img alt="" width="960" height="960" loading="lazy" decoding="async">
          </picture>
          <figcaption hidden></figcaption>
        </figure>

        <img class="vocacion__estetoscopio" src="/assets/decoracion/estetoscopio-desenfocado.webp" width="440" height="440" alt="" aria-hidden="true">
      </section>

      <section class="mensaje">
        <p class="mensaje__texto"></p>
        <img class="mensaje__flores" src="/assets/decoracion/flores-borde.webp" width="1600" height="760" alt="" aria-hidden="true" loading="lazy" decoding="async">
      </section>

      <section class="misa" aria-labelledby="misa-etiqueta">
        <div class="misa__tarjeta">
          <img class="misa__cruz" src="/assets/decoracion/cruz-luz.png" width="450" height="450" alt="" aria-hidden="true" loading="lazy" decoding="async">
          <h2 id="misa-etiqueta" class="misa__etiqueta"></h2>
          <img class="misa__separador" src="/assets/decoracion/separador-turquesa.png" width="460" height="40" alt="" aria-hidden="true">
          <p class="misa__fecha"></p>
          <ul class="misa__datos">
            <li class="misa__datos-item">
              <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              <span class="misa__dato-texto"></span>
            </li>
            <li class="misa__datos-item">
              <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3v3"></path>
                <path d="M9 6h6"></path>
                <path d="M12 6l-7 5v10h14V11l-7-5z"></path>
                <path d="M8 21v-6h3v6"></path>
                <path d="M13 21v-6h3v6"></path>
              </svg>
              <span class="misa__dato-texto"></span>
            </li>
            <li class="misa__datos-item">
              <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 10c0 4.4-8 12-8 12s-8-7.6-8-12a8 8 0 0 1 16 0Z"></path>
                <circle cx="12" cy="10" r="3"></circle>
              </svg>
              <span class="misa__dato-texto"></span>
            </li>
          </ul>

          <div class="misa__cuenta" role="timer" aria-live="off">
            <div class="misa__cuenta-celda">
              <span class="misa__cuenta-numero"></span>
              <span class="misa__cuenta-etiqueta"></span>
            </div>
            <div class="misa__cuenta-celda">
              <span class="misa__cuenta-numero"></span>
              <span class="misa__cuenta-etiqueta"></span>
            </div>
            <div class="misa__cuenta-celda">
              <span class="misa__cuenta-numero"></span>
              <span class="misa__cuenta-etiqueta"></span>
            </div>
            <div class="misa__cuenta-celda">
              <span class="misa__cuenta-numero"></span>
              <span class="misa__cuenta-etiqueta"></span>
            </div>
            <p class="misa__cuenta-mensaje" hidden aria-live="polite"></p>
          </div>
        </div>
      </section>

      <button type="button" class="musica">
        <svg class="musica__icono musica__icono--nota" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
        <svg class="musica__icono musica__icono--barras" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="6" y1="4" x2="6" y2="20"></line>
          <line x1="12" y1="4" x2="12" y2="20"></line>
          <line x1="18" y1="4" x2="18" y2="20"></line>
        </svg>
      </button>
    </main>

    <script type="module" src="src/main.ts"></script>
  </body>
</html>
